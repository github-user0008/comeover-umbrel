manifestVersion: 1
id: comeover
category: networking
name: ComeOver
version: "0.1.0"
tagline: Invite someone over and watch them arrive
description: >-
  ComeOver is an account-free live arrival relay for the last few minutes of a
  visit. One person starts a room, shares a short code or link, and both sides
  watch a live map with distance, ETA and a countdown until they are at the door.


  This package installs the relay. Open it from the Umbrel dashboard to see
  whether the relay is healthy and to copy the address your phones and TVs
  should use in **Settings → Relay**.


  **Before you start**


  - The direct relay port is published on `8787` so the Android/iOS apps and TVs
    can use REST and Socket.IO without the Umbrel login. Keep Umbrel on your
    trusted LAN or Tailscale tailnet; do not expose that port to the public
    internet.

  - The dashboard on port `8788` stays behind Umbrel auth. The `/api/*`, `/socket.io*`,
    `/j/*` and `/healthz` paths are whitelisted so companion clients can connect.

  - Rooms are in memory only. Restarting the app or the Umbrel drops active
    rooms. No accounts, analytics or cloud database are involved.


  **Connect a guest**


  A guest needs a network path to this Umbrel. The simplest option is to share
  the Umbrel node with them from the Tailscale admin console. They accept the
  share, install the ComeOver client, and enter the relay address shown on the
  dashboard. Guests on the same LAN can use the Umbrel LAN IP instead.
